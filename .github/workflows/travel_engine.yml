name: Travel Deal Engine Pipeline

on:
  schedule:
    # Esecuzione automatica ogni lunedì alle 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: # Permette l'esecuzione manuale dalla scheda Actions su GitHub

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Travel Engine Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
        run: |
          python main.py

      - name: Upload Newsletter Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-newsletter
          path: output/